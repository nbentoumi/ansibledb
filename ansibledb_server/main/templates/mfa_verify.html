<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  background-color: #9f9da7;
  font-size: 1.6rem;
  font-family: "Open Sans", sans-serif;
  color: #2b3e51;
}
h2 {
  font-weight: 300;
  text-align: center;
}
#login-form-wrap {
  background-color: #fff;
  width: 35%;
  margin: 180px auto;
  text-align: center;
  padding: 20px 0 0 0;
  border-radius: 4px;
  box-shadow: 0px 30px 50px 0px rgba(0, 0, 0, 0.2);
}
#login-form {
  padding: 0 100px;
}
input {
  display: block;
  box-sizing: border-box;
  width: 100%;
  outline: none;
  height: 40px;
  line-height: 40px;
  border-radius: 4px;
}
input[type="text"] {
  width: 100%;
  padding: 0 0 0 10px;
  margin: 0;
  color: #8a8b8e;
  border: 1px solid #c2c0ca;
  font-size: 16px;
  text-align: center;
  letter-spacing: 8px;
}
input[type="submit"] {
  border: none;
  display: block;
  background-color: #3ca9e2;
  color: #fff;
  font-weight: bold;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 18px;
}
input[type="submit"]:hover {
  background-color: #329dd5;
}
#create-account-wrap {
  background-color: #eeedf1;
  color: #8a8b8e;
  font-size: 14px;
  width: 100%;
  padding: 10px 0;
  border-radius: 0 0 4px 4px;
}
</style>
</head>
<body>
<div id="login-form-wrap">
  <h2 style="color: #696666;">AnsibleDB</h2>
  <p style="color: #696666; font-size: 14px;">Enter the verification code from your authenticator app</p>
  <form id="login-form" action="/mfa_verify" method="POST">
    <p>
    <input type="text" id="otp_code" name="otp_code" placeholder="000000" maxlength="6" pattern="[0-9]{6}" required autofocus autocomplete="one-time-code">
    </p>
    <p>
    <input type="submit" id="verify" value="Verify">
    </p>
    {% if msg %}<center><p style="color: #cc1e2b; font-size: small;">{{ msg }}</p></center>{% endif %}
  </form>
  <div id="create-account-wrap">
    <p><a href="/login" style="color: #8a8b8e;">Back to login</a></p>
  </div>
</div>
</body>
</html>
